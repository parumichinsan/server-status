[project]
name = "server-status"
version = "0.1.0"
description = "status.parumichinsan.xyz のステータスページ"
readme = "README.md"
authors = [
    { name = "parumichinsan", email = "harumento@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "psutil>=7.0.0",
]

[project.scripts]
